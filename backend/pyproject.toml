[project]
name = "horus-backend"
version = "0.0.1"
description = "Horus backend: engagement state (horus_state), live-meeting runtime (horus_meet), mail, appraisal toolkit and website intake (horus_intake)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
horus-meet = "horus_meet.cli:app"
horus-meet-mcp = "horus_meet.server:main"
horus = "horus_state.cli:app"
horus-state = "horus_state.server:main"
horus-mail = "horus_mail.cli:app"
horus-intake = "horus_intake.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# macOS: cloned files inherit a hidden flag that makes Python 3.12 skip the editable .pth file
link-mode = "copy"

[tool.uv.build-backend]
module-name = ["horus_meet", "horus_state", "horus_mail", "horus_appraisal", "horus_intake"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
